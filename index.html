<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Wordle Helper & Analyzer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main>
        <section class="controls">
            <input id="guessInput" type="text" maxlength="5" placeholder="Type 5-letter guess" />
            <button id="addRowBtn">Add Row</button>
            <button id="applyBtn">Apply Feedback</button>
            <button id="resetBtn">Reset</button>
            <button id="toggleAnswersBtn" class="btn-blue">Answers: Official Set</button> 
            <button id="analyzeBtn" class="btn-purple">Analyze Game</button>
            
            <div id="status">Loading words...</div>
        </section>

        <section id="boardSection">
            <div id="board"></div> 
        </section>

        <section id="info">
            <div id="stats">
                <div class="stat-item">
                    <strong>Possible solutions:</strong> <span id="possibleCount">—</span>
                </div>
                <div class="stat-item">
                    <strong>Theoretical min guesses:</strong> <span id="minGuesses">—</span>
                </div>
                <div class="stat-item">
                    <strong>Expected remaining:</strong> <span id="expectedAfter">—</span>
                </div>
                <div class="stat-item">
                    <strong>Average Game Skill:</strong> <span id="avgSkill">—</span>
                </div>
            </div>

            <div id="suggestionsWrap">
                <div class="header-flex">
                    <h2>Top Suggestions</h2>
                    <div class="sort-controls">
                        <button id="sortExpBtn" class="active-sort">Exp. Rem</button>
                        <button id="sortEntropyBtn">Entropy</button>
                        <button id="sortScoreBtn">Base Score</button>
                    </div>
                </div>
                
                <div id="computing" class="hidden">Computing... ⏳</div>
                <ol id="suggestions"></ol>
            </div>

            <div id="possibleAnswersWrap" class="hidden">
                <h2>Possible Answers</h2>
                <ul id="possibleAnswers"></ul>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
